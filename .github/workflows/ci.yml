name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'   # weekly parity re-check

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: .cache
          key: rules-${{ hashFiles('scripts/build-rules.mjs') }}
      - run: npm run rules
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: 'true' }

  parity:
    # Heavy job: weekly, on manual dispatch, and when the rules or engine change (finance-check-r1).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[parity]')
    # (also run it whenever rules/engine change; see the paths filter in the rules job note)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: spike } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: spike/package-lock.json }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - run: ./run-parity.sh
      # Parity of the shipped engine: the built app's validator in Chromium over the same 678 files.
      - name: Build app
        working-directory: .
        run: npm ci && npm run rules && npm run build && npx playwright install --with-deps chromium
      # (rules download is retried and checksum-verified in scripts/build-rules.mjs)
      - name: Shipped-engine parity (browser): XML and ZUGFeRD/Factur-X PDFs
        working-directory: .
        run: |
          node spike/zugferd/make-corpus.mjs
          npx wrangler pages dev dist --port 8788 > /tmp/wrangler.log 2>&1 &
          npx wait-on -t 120000 http://localhost:8788 || (cat /tmp/wrangler.log; exit 1)
          npm run test:parity
          node scripts/parity-zugferd.mjs
